  /api/v1/campaigns/{type}/{id}/bids:
    patch:
      description: |
        Update every (or a subset of) ad's bid in one call. Three modes:

          - `set`     — overwrite each target ad's bid with `value`.
          - `pct_inc` — raise each target ad's bid by `pct` percent.
          - `pct_dec` — lower each target ad's bid by `pct` percent.

        Optional `ad_ids` narrows the update to a subset (omit or empty
        list = every non-deleted ad on the campaign). Bids are clamped at
        0 — anything that would resolve below 0 is set to 0.

        Bid values are in main-currency units (the same scale `bid` is
        stored in). For minimum-acceptable-bid floors call
        `GET /api/v1/campaigns/{type}/{id}/min-bid` first.
      parameters:
      - explode: false
        in: path
        name: type
        required: true
        schema:
          enum:
          - ron
          - cpm
          - rtb
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              flat-set:
                summary: Set every ad to bid 0.0042
                value:
                  mode: set
                  value: 0.0042
              raise-10pct:
                summary: Raise every ad's bid 10%
                value:
                  mode: pct_inc
                  pct: 10
              cool-subset:
                summary: Cool 3 specific ads' bids by 25%
                value:
                  mode: pct_dec
                  pct: 25
                  ad_ids:
                  - 101
                  - 102
                  - 103
            schema:
              $ref: "#/components/schemas/_api_v1_campaigns__type___id__bids_patch_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_campaigns__type___id__bids_patch_200_response"
          description: Updated.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Campaign not found.
        "422":
          description: Validation error (invalid mode / value / pct).
      summary: Mass update bids on every ad in a campaign.
      tags:
      - Campaigns
      x-scope: campaigns.write
      x-status: stable
      x-codeSamples:
      - lang: shell
