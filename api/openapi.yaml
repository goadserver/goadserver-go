openapi: 3.1.0
info:
  contact:
    name: GoAdServer support
  description: |
    Public REST API for advertisers and publishers on the GoAdServer platform.

    **Authentication.** All endpoints (except `/api/public/*`) require an API
    key passed as `Authorization: Bearer gas_live_…`. Create and manage keys
    in your account settings — each key has its own scopes, optional resource
    pinning, optional IP allowlist, and per-key rate limit.

    **System rules apply over API rules.** The public API never lets a key
    bypass restrictions the same user faces in the panel:

    - **Source names** (`stats_source_names` right). When the user lacks
      this right, advertiser stats responses return `{id, name}` with
      `name` equal to the id — no human label leaks through.
    - **SubID encoding** (`modules.global.subid_encoding`). When enabled
      for the system, the user only ever sees encoded SubIDs in the panel.
      The API mirrors this both ways: `subid_excl`/`subid_incl` filter
      endpoints accept the encoded form on write (decoded server-side
      before storage) and emit the encoded form on read.
    - **Module gating.** Endpoints whose module is disabled for the
      tenant don't appear in the spec or routes.txt at all.

    **Client SDKs.** Each SDK is generated from this spec and published as
    a public GitHub repository under the `goadserver` organization. The
    same tarball is also embedded in the API server and downloadable from
    `/api/public/sdk/<lang>.tgz` — useful when GitHub is unreachable.

    > **Per-network host.** The default `https://up.go-adserver.com`
    > baked into the published SDKs is a reference host. Every white-label
    > tenant runs on its own panel domain — override the host on first use
    > (`setHost()` / `Configuration.host` / `basePath` etc.). Or, fetch the
    > spec from your own tenant (`/api/public/openapi.yaml` returns it with
    > *your* hostname as the default) and regenerate the SDK locally — the
    > regenerated client has your URL baked in.

    - **PHP** — `github.com/goadserver/goadserver-php`
      (namespace `GoAdServer\Api`, composer name `goadserver/sdk`).

      ```bash
      composer config repositories.goadserver vcs https://github.com/goadserver/goadserver-php
      composer require goadserver/sdk:dev-main
      ```

      ```php
      $cfg = GoAdServer\Api\Configuration::getDefaultConfiguration()
              ->setHost('https://up.go-adserver.com')
              ->setAccessToken('gas_live_…');
      $api = new GoAdServer\Api\Api\AccountAPIApi(null, $cfg);
      $me  = $api->apiV1AccountGet();
      ```

    - **Go** — `github.com/goadserver/goadserver-go`.

      ```bash
      go get github.com/goadserver/goadserver-go@latest
      ```

      ```go
      import gas "github.com/goadserver/goadserver-go"

      cfg := gas.NewConfiguration()
      cfg.Servers = gas.ServerConfigurations{{URL: "https://up.go-adserver.com"}}
      cli := gas.NewAPIClient(cfg)
      ctx := context.WithValue(context.Background(),
          gas.ContextAccessToken, "gas_live_…")
      me, _, err := cli.AccountAPI.ApiV1AccountGet(ctx).Execute()
      ```

    - **Python** — `github.com/goadserver/goadserver-python` (package
      `goadserver`). Pulls `pydantic` + `urllib3` automatically.

      ```bash
      pip install git+https://github.com/goadserver/goadserver-python.git
      ```

      ```python
      from goadserver import ApiClient, Configuration
      from goadserver.api import AccountApi, CampaignsApi

      cfg = Configuration(host="https://up.go-adserver.com")
      cfg.access_token = "gas_live_…"
      client = ApiClient(cfg)

      me = AccountApi(client).api_v1_account_get()
      camps = CampaignsApi(client).api_v1_campaigns_get(per_page=10)
      ```

    - **JavaScript / TypeScript** — `github.com/goadserver/goadserver-js`
      (npm name `goadserver-sdk`, generator `typescript-fetch`).

      ```bash
      npm install github:goadserver/goadserver-js
      ```

      ```ts
      import { Configuration, AccountApi, CampaignsApi }
        from "goadserver-sdk";

      const cfg = new Configuration({
        basePath: "https://up.go-adserver.com",
        accessToken: "gas_live_…",
      });

      const me   = await new AccountApi(cfg).apiV1AccountGet();
      const list = await new CampaignsApi(cfg).apiV1CampaignsGet({ perPage: 10 });
      ```

      The CJS build is broadly compatible (Node + bundlers); the ESM
      build is missing trailing `.js` extensions in its imports, a known
      `typescript-fetch` quirk — most consumers use CJS.

    **Offline / firewalled install.** If the customer's network can't
    reach GitHub, every SDK's source is also served as a tarball from the
    API host:

    ```bash
    curl -O https://up.go-adserver.com/api/public/sdk/python.tgz
    tar xzf python.tgz && pip install ./python
    ```

    Round-trip smoke tests for all four SDKs live at `clients/_smoke/`
    in the platform repo.
  title: GoAdServer Public API
  version: 1.0.0
servers:
- description: |
    Default reference host. Every tenant runs on its own panel
    domain (white-labeled, e.g. `panel.eroadvertising.com` or
    `up.<your-network>.com`). The SDK's default host is provided
    for convenience — override it for your network with
    `setHost()` (PHP), `Configuration.host` (Python),
    `Configuration{Host: …}` (Go), or `basePath` (JS / TS).
    The same spec served from your tenant at
    `/api/public/openapi.yaml` already lists *your* host first,
    so a freshly-generated SDK from there has the right URL baked in.
  url: https://up.go-adserver.com
- description: Staging / dev panel
  url: https://vue.go-adserver.com
security:
- apiKey: []
tags:
- description: "Identity, profile, and API key management."
  name: Account
- description: Read campaigns + on/off toggle. Full CRUD not yet exposed.
  name: Campaigns
- description: "Banner / video / native creative pools — list, create, update, clone,\
    \ delete, plus per-item management."
  name: Creative Pools
- description: "Click-URL pools used by RON ads — list, create, update, clone, delete,\
    \ plus per-URL management."
  name: URL Pools
- description: Account balance and deposit status.
  name: Funds
- description: "Conversion-tracking pixels — create, list, update, delete."
  name: Tracking
- description: Retargeting pixels — capture visitor IDs for re-engagement campaigns.
  name: Retargeting
- description: "Domain / ISP / adzone / SubID / IP filters — read, toggle on/off,\
    \ delete."
  name: Filters
- description: Read publisher websites.
  name: Sites
- description: Read publisher ad zones + on/off toggle.
  name: Adspaces
- name: Stats — Advertiser
- name: Stats — Advertiser RTB
- name: Stats — Advertiser Offers
- name: Stats — Publisher
- name: Stats — Publisher SSP
- name: Stats — Publisher SmartZones
- name: Stats — Affiliate
- description: No-auth discovery endpoints.
  name: Public
paths:
  /api/v1/account:
    get:
      description: |
        Minimal identity payload. Use this to verify a key is alive,
        discover which user it belongs to, and inspect what scopes the key
        was granted. No PII beyond name/email/company.

        Key management (create/list/revoke) is **not** exposed via the
        public API — it requires a browser session. Visit MyAccount →
        API access in the panel.
      responses:
        "200":
          content:
            application/json:
              example:
                api_key:
                  id: 3
                  scopes:
                  - account.read
                  - adspaces.read
                company: ""
                email: jan@goadserver.com
                name: Jan Huibers
                system_id: 4
                user_id: 1
              schema:
                $ref: "#/components/schemas/_api_v1_account_get_200_response"
          description: Current user identity (and key context if authenticated by
            API key)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: Identity check — returns the authenticated user + scopes of the calling
        key.
      tags:
      - Account
      x-scope: account.read
      x-status: stable
      x-codeSamples:
      - lang: shell
        label: curl
        source: |
          curl -sS -X GET "https://up.go-adserver.com/api/v1/account" \
            -H "Authorization: Bearer $GAS_API_KEY"
      - lang: php
        label: PHP (cURL)
        source: |
          <?php
          $apiKey = getenv("GAS_API_KEY");
          $ch = curl_init("https://up.go-adserver.com/api/v1/account");
          curl_setopt_array($ch, [
              CURLOPT_CUSTOMREQUEST => "GET",
              CURLOPT_HTTPHEADER => [
                  "Authorization: Bearer $apiKey",
                  "Content-Type: application/json",
              ],
              CURLOPT_RETURNTRANSFER => true,
          ]);
          $response = curl_exec($ch);
          $status = curl_getinfo($ch, CURLINFO_HTTP_CODE);
          curl_close($ch);

          $data = json_decode($response, true);
          if ($status >= 400) {
              throw new RuntimeException("API error $status: $response");
          }
          print_r($data);
      - lang: go
        label: Go (stdlib)
        source: |
          package main

          import (
              "fmt"
              "io"
              "net/http"
              "os"
          )

          func main() {
              req, _ := http.NewRequest("GET", "https://up.go-adserver.com/api/v1/account", nil)
              req.Header.Set("Authorization", "Bearer "+os.Getenv("GAS_API_KEY"))
              req.Header.Set("Content-Type", "application/json")

              res, err := http.DefaultClient.Do(req)
              if err != nil { panic(err) }
              defer res.Body.Close()

              body, _ := io.ReadAll(res.Body)
              if res.StatusCode >= 400 {
                  panic(fmt.Sprintf("API error %d: %s", res.StatusCode, body))
              }
              fmt.Println(string(body))
          }
  /api/v1/campaigns:
    get:
      description: |
        Returns the caller's campaigns. By default each row carries a
        rich-but-bounded projection: identity (`id`, `name`, `campaign_type`,
        `ad_type` + `ad_type_label`, `selling_type`), lifecycle
        (`is_paused`, `is_active`, `is_deleted`, `is_complete`,
        `pending_state`), budget (`daily_budget`, `daily_spent`,
        `total_budget`, `total_spent`, `use_campaign_budget`), bidding
        (`bid_default`, `min_bid`), targeting summary (`countries`,
        `languages`, `categories`, `device_type_ids`, …), capping,
        schedule, linked filter/pool ids, and timestamps.

        Use `?fields=` to opt in or out of fields:

          - `?fields=*` — return **every** column on the underlying
            campaign row (70+ fields, type-dependent). Convenient for
            AI agents that want the full picture in one call.
          - `?fields=name,daily_budget,countries` — narrow to just
            those fields. `id` is always included.
          - (omitted) — default rich projection above.
      parameters:
      - explode: true
        in: query
        name: type
        required: false
        schema:
          default: all
          enum:
          - all
          - ron
          - cpm
          - flatrate
          - directdeal
          - rtb
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: CSV of fields to return; `*` returns everything available.
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - ad_type: 2
                  ad_type_label: Banner Ads
                  campaign_type: ron
                  countries: "0"
                  created_at: 2026-04-27
                  daily_budget: 50
                  device_type_ids: "0"
                  groupid: "0"
                  id: 445321
                  is_active: false
                  is_complete: true
                  is_deleted: false
                  is_paused: true
                  name: Header bidding testing — API clone test
                  num_ads: 0
                  selling_type: 1
                  total_budget: 0
                  use_campaign_budget: false
                - ad_type: 2
                  ad_type_label: Banner Ads
                  campaign_type: ron
                  countries: "0"
                  created_at: 2026-04-26
                  daily_budget: 50
                  device_type_ids: "0"
                  groupid: "0"
                  id: 445071
                  is_active: true
                  is_complete: true
                  is_deleted: false
                  is_paused: false
                  name: Header bidding testing
                  num_ads: 0
                  selling_type: 1
                  total_budget: 0
                  use_campaign_budget: false
                page: 1
                per_page: 2
                total_rows: 66
              schema:
                $ref: "#/components/schemas/_api_v1_campaigns_get_200_response"
          description: Paginated campaign list (projected to a stable subset of fields).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: List the caller's campaigns across all types (or one type).
      tags:
      - Campaigns
      x-scope: campaigns.read
      x-status: stable
      x-codeSamples:
      - lang: shell
        label: curl
        source: |
          curl -sS -X GET "https://up.go-adserver.com/api/v1/campaigns" \
            -H "Authorization: Bearer $GAS_API_KEY"
      - lang: php
        label: PHP (cURL)
        source: |
          <?php
          $apiKey = getenv("GAS_API_KEY");
          $ch = curl_init("https://up.go-adserver.com/api/v1/campaigns");
          curl_setopt_array($ch, [
              CURLOPT_CUSTOMREQUEST => "GET",
              CURLOPT_HTTPHEADER => [
                  "Authorization: Bearer $apiKey",
                  "Content-Type: application/json",
              ],
              CURLOPT_RETURNTRANSFER => true,
          ]);
          $response = curl_exec($ch);
          $status = curl_getinfo($ch, CURLINFO_HTTP_CODE);
          curl_close($ch);

          $data = json_decode($response, true);
          if ($status >= 400) {
              throw new RuntimeException("API error $status: $response");
          }
          print_r($data);
      - lang: go
        label: Go (stdlib)
        source: |
          package main

          import (
              "fmt"
              "io"
              "net/http"
              "os"
          )

          func main() {
              req, _ := http.NewRequest("GET", "https://up.go-adserver.com/api/v1/campaigns", nil)
              req.Header.Set("Authorization", "Bearer "+os.Getenv("GAS_API_KEY"))
              req.Header.Set("Content-Type", "application/json")

              res, err := http.DefaultClient.Do(req)
              if err != nil { panic(err) }
              defer res.Body.Close()

              body, _ := io.ReadAll(res.Body)
              if res.StatusCode >= 400 {
                  panic(fmt.Sprintf("API error %d: %s", res.StatusCode, body))
              }
              fmt.Println(string(body))
          }
  /api/v1/campaigns/{type}/_schema:
    get:
      description: |
        Discovery endpoint for AI agents and integrators. Returns the
        canonical list of public field names a `POST /api/v1/campaigns/{type}`
        accepts, with type, required-flag, default value, an example, and
        a one-line description. `ad_type` enumerates the active ad-type
        ids on the caller's tenant.

        Use this to drive form UIs, validate agent-generated payloads
        client-side, or feed into a function-calling LLM.
      parameters:
      - explode: false
        in: path
        name: type
        required: true
        schema:
          enum:
          - ron
          - cpm
          - flatrate
          - directdeal
          - rtb
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_campaigns__type___schema_get_200_response"
          description: Schema.
      summary: Field metadata for create/update.
      tags:
      - Campaigns
      x-scope: campaigns.read
      x-status: stable
      x-codeSamples:
      - lang: shell
        label: curl
        source: |
          curl -sS -X GET "https://up.go-adserver.com/api/v1/campaigns/ron/_schema" \
            -H "Authorization: Bearer $GAS_API_KEY"
      - lang: php
        label: PHP (cURL)
        source: |
          <?php
          $apiKey = getenv("GAS_API_KEY");
          $ch = curl_init("https://up.go-adserver.com/api/v1/campaigns/ron/_schema");
          curl_setopt_array($ch, [
              CURLOPT_CUSTOMREQUEST => "GET",
              CURLOPT_HTTPHEADER => [
                  "Authorization: Bearer $apiKey",
                  "Content-Type: application/json",
              ],
              CURLOPT_RETURNTRANSFER => true,
          ]);
          $response = curl_exec($ch);
          $status = curl_getinfo($ch, CURLINFO_HTTP_CODE);
          curl_close($ch);

          $data = json_decode($response, true);
          if ($status >= 400) {
              throw new RuntimeException("API error $status: $response");
          }
          print_r($data);
      - lang: go
        label: Go (stdlib)
        source: |
          package main

          import (
              "fmt"
