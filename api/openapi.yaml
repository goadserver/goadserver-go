components:
  parameters:
    From:
      description: ISO date — inclusive start. Defaults to 7 days ago.
      explode: true
      in: query
      name: from
      required: false
      schema:
        format: date
        type: string
      style: form
    To:
      description: ISO date — inclusive end. Defaults to today. Max range 92 days.
      explode: true
      in: query
      name: to
      required: false
      schema:
        format: date
        type: string
      style: form
    Interval:
      explode: true
      in: query
      name: interval
      required: false
      schema:
        default: sum
        enum:
        - day
        - hour
        - week
        - month
        - sum
        type: string
      style: form
    GroupBy:
      description: |
        Comma-separated dimensions to aggregate by, in priority order.
        Max 4 dimensions. Available dimensions vary per endpoint — see
        the per-endpoint description.
      explode: true
      in: query
      name: group_by
      required: false
      schema:
        type: string
      style: form
    Metrics:
      description: |
        Optional comma-separated metric whitelist. When omitted, all
        metrics for the endpoint are returned.
      explode: true
      in: query
      name: metrics
      required: false
      schema:
        type: string
      style: form
    Format:
      explode: true
      in: query
      name: format
      required: false
      schema:
        default: json
        enum:
        - json
        - csv
        type: string
      style: form
    Page:
      explode: true
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
      style: form
    PerPage:
      explode: true
      in: query
      name: per_page
      required: false
      schema:
        default: 100
        maximum: 1000
        minimum: 1
        type: integer
      style: form
    Sort:
      description: Field name. Prefix with `-` for descending (e.g. `-views`).
      explode: true
      in: query
      name: sort
      required: false
      schema:
        type: string
      style: form
  responses:
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Missing or invalid API key.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "Key lacks the required scope, or IP not in allowlist, or account\
        \ suspended."
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Per-key rate limit exceeded (default 60 rpm).
  schemas:
    Error:
      example:
        scope: scope
        error: missing_scope
        message: message
      properties:
        error:
          example: missing_scope
          type: string
        message:
          type: string
        scope:
          type: string
      required:
      - error
      - message
    ApiKeyDetails:
      properties:
        id:
          type: integer
        name:
          maxLength: 64
          type: string
        prefix:
          example: gas_live_abc1
          type: string
        scopes:
          items:
            type: string
          type: array
        ip_allowlist:
          description: "CSV of IPs/CIDRs, empty = any"
          type: string
        rate_limit_rpm:
          description: 0 = system default (60)
          type: integer
        expires_at:
          format: date-time
          type: string
          nullable: true
        last_used_at:
          format: date-time
          type: string
          nullable: true
        last_used_ip:
          type: string
        call_count:
          type: integer
        revoked_at:
          format: date-time
          type: string
          nullable: true
        created_at:
          format: date-time
          type: string
    ApiKeyDetailsCreated:
      allOf:
      - $ref: "#/components/schemas/ApiKeyDetails"
      - properties:
          key:
            description: |
              **Plaintext key — shown ONCE.** Save it now; it cannot be
              retrieved again. To rotate, create a new key and revoke
              this one.
            type: string
          message:
            type: string
    ResourceFilter:
      description: Pin a key to specific resources. Empty/missing = no restriction.
      example:
        site_ids:
        - 2
        - 2
        campaign_ids:
        - 5
        - 5
        creative_ids:
        - 7
        - 7
        adzone_ids:
        - 5
        - 5
      properties:
        campaign_ids:
          items:
            type: integer
          type: array
        adzone_ids:
          items:
            type: integer
          type: array
        site_ids:
          items:
            type: integer
          type: array
