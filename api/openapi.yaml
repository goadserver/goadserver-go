    post:
      description: |
        Creates a new ad attached to the campaign. JSON-only — agents
        reference an existing creative (banner pool, single creative,
        URL or HTML) instead of uploading files. The panel handler at
        the same path still accepts `multipart/form-data` for file
        uploads — this docs entry covers the JSON path only.

        Required: `title` + `bid` + exactly **one** creative reference
        (`banner_pool_id` / `creative_id` / `banner_url` / `banner_html`
        / `video_pool_id`). `destination_url` is required unless the
        creative carries its own URL (popunder/JS) or you set
        `url_pool_id`.

        **Modes:**
          - `?dry_run=1` — return the resolved field map + computed
            `creatives` JSON without inserting.
          - `?strict=1` — reject unknown field names with a 422.
      parameters:
      - explode: false
        in: path
        name: type
        required: true
        schema:
          enum:
          - ron
          - cpm
          - flatrate
          - directdeal
          - rtb
          type: string
        style: simple
      - explode: false
        in: path
        name: campaignId
        required: true
        schema:
          type: integer
        style: simple
      - explode: true
        in: query
        name: dry_run
        required: false
        schema:
          enum:
          - "1"
          type: string
        style: form
      - explode: true
        in: query
        name: strict
        required: false
        schema:
          enum:
          - "1"
          type: string
        style: form
      requestBody:
        content:
          application/json:
            examples:
              banner-pool:
                summary: Reference an existing banner pool
                value:
                  title: My banner ad
                  bid: 0.0042
                  banner_pool_id: 129481
                  destination_url: https://example.com/lander
              direct-creative:
                summary: Reference a single creative
                value:
                  title: Single creative
                  bid: 0.0042
                  creative_id: 1080936
                  destination_url: https://example.com
              tag:
                summary: Tag-based (HTML) ad unit
                value:
                  title: Header bidding tag
                  bid: 0.0099
                  banner_html: <script src="https://cdn.example.com/tag.js"></script>
              with-url-rotation:
                summary: Pool + URL rotation
                value:
                  title: Multi-LP ad
                  bid: 0.005
                  banner_pool_id: 129481
                  url_pool_id: 4233
            schema:
              $ref: "#/components/schemas/_api_v1_campaigns__type___campaignId__ads_post_request"
        required: true
      responses:
        "201":
          description: "Created. Body is the freshly-created ad in the same shape\
            \ as `GET /campaigns/{type}/{campaignId}/ads/{adId}`."
        "200":
          description: "When `?dry_run=1` — body is `{ dry_run: true, resolved: ...,\
            \ creatives: ..., would_insert: ... }`."
        "422":
          content:
            application/json:
              examples:
                missing_required:
                  summary: bid missing
                  value:
                    error: validation_error
                    message: The given data was invalid.
                    errors:
                      bid:
                      - Bid is required.
                too_many_creatives:
                  summary: more than one creative ref set
                  value:
                    error: validation_error
                    message: The given data was invalid.
                    errors:
                      creative:
                      - Specify exactly one of banner_pool_id / creative_id / banner_url
                        / banner_html / video_pool_id.
                strict_unknown:
                  summary: ?strict=1 caught a typo
                  value:
                    error: unknown_fields
                    message: ?strict=1 rejected unknown fields. Drop them or omit
                      ?strict.
                    unknown_fields:
                    - foo
          description: Validation error.
        "404":
          description: Campaign not found.
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: "Create an ad on a campaign (smart-default, JSON-only)."
      tags:
      - Campaigns
      x-scope: creatives.upload
      x-status: stable
      x-codeSamples:
      - lang: shell
