              fmt.Println(string(body))
          }
  /api/v1/campaigns/{type}:
    post:
      description: |
        Creates a new campaign with sensible defaults applied for any
        field you don't send. Required: `name` + `ad_type`. Everything
        else (targeting, capping, schedule, …) defaults to "all/none"
        unless explicitly supplied — see
        `GET /api/v1/campaigns/{type}/_schema` for the full field list.

        The campaign always starts paused (`is_paused=true`) so you can
        attach ads via `POST /api/v1/campaigns/{type}/{id}/ads` and verify
        before activating. Flip the active flag when ready via
        `PATCH /api/v1/campaigns/{type}/{id}/active`.

        **Modes:**
          - `?dry_run=1` — validate and return the resolved field map
            without inserting. Useful for previewing what an LLM would
            create before charging it.
          - `?strict=1` — reject unknown field names with a 422 listing
            them. Without this, unknown keys are silently ignored.
      parameters:
      - explode: false
        in: path
        name: type
        required: true
        schema:
          enum:
          - ron
          - cpm
          - flatrate
          - directdeal
          - rtb
          type: string
        style: simple
      - explode: true
        in: query
        name: dry_run
        required: false
        schema:
          enum:
          - "1"
          type: string
        style: form
      - explode: true
        in: query
        name: strict
        required: false
        schema:
          enum:
          - "1"
          type: string
        style: form
      requestBody:
        content:
          application/json:
            examples:
              minimal:
                summary: Smallest possible body
                value:
                  name: My first API campaign
                  ad_type: 2
              targeted:
                summary: With targeting + capping
                value:
                  name: US/UK desktop banners
                  ad_type: 2
                  daily_budget: 25
                  countries: "US,GB"
                  device_type_ids: "1"
                  use_capping: true
                  capping_hours: 24
              dry-run-preview:
                summary: Preview without committing
                value:
                  name: Preview only
                  ad_type: 2
                  daily_budget: 5
            schema:
              $ref: "#/components/schemas/_api_v1_campaigns__type__post_request"
        required: true
      responses:
        "201":
          description: "Created. Body is the freshly-created campaign in the public\
            \ projection (same shape as `GET /api/v1/campaigns/{type}/{id}`)."
        "200":
          description: "When `?dry_run=1` — body is `{ dry_run: true, resolved: ...,\
            \ would_insert: ... }`."
        "422":
          content:
            application/json:
              examples:
                missing_required:
                  summary: ad_type missing
                  value:
                    error: validation_error
                    message: The given data was invalid.
                    errors:
                      ad_type:
                      - ad_type is required (see GET /api/v1/campaigns/<type>/_schema
                        for valid ids).
                strict_unknown:
                  summary: ?strict=1 caught a typo
                  value:
                    error: unknown_fields
                    message: ?strict=1 rejected unknown fields. Drop them or omit
                      ?strict.
                    unknown_fields:
                    - typoo
          description: "Validation error (missing required, unknown field with `?strict=1`,\
            \ …)."
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: Create a new campaign (smart-default).
      tags:
      - Campaigns
      x-scope: campaigns.write
      x-status: stable
      x-codeSamples:
      - lang: shell
        label: curl
        source: |
          curl -sS -X POST "https://up.go-adserver.com/api/v1/campaigns/ron" \
            -H "Authorization: Bearer $GAS_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
            "name": "My first API campaign",
            "ad_type": 2
          }'
      - lang: php
        label: PHP (cURL)
        source: |
          <?php
          $apiKey = getenv("GAS_API_KEY");
          $payload = [
              "name" => "My first API campaign",
              "ad_type" => 2
          ];

          $ch = curl_init("https://up.go-adserver.com/api/v1/campaigns/ron");
          curl_setopt_array($ch, [
              CURLOPT_CUSTOMREQUEST => "POST",
              CURLOPT_HTTPHEADER => [
                  "Authorization: Bearer $apiKey",
                  "Content-Type: application/json",
              ],
              CURLOPT_POSTFIELDS => json_encode($payload),
              CURLOPT_RETURNTRANSFER => true,
          ]);
          $response = curl_exec($ch);
          $status = curl_getinfo($ch, CURLINFO_HTTP_CODE);
          curl_close($ch);

          $data = json_decode($response, true);
          if ($status >= 400) {
              throw new RuntimeException("API error $status: $response");
          }
          print_r($data);
      - lang: go
        label: Go (stdlib)
        source: |
          package main

          import (
              "fmt"
              "io"
              "net/http"
              "os"
              "bytes"
              "encoding/json"
          )

          func main() {
              payload := map[string]any{
                  "name": "My first API campaign",
                  "ad_type": 2,
              }
              raw, _ := json.Marshal(payload)

              req, _ := http.NewRequest("POST", "https://up.go-adserver.com/api/v1/campaigns/ron", bytes.NewReader(raw))
              req.Header.Set("Authorization", "Bearer "+os.Getenv("GAS_API_KEY"))
              req.Header.Set("Content-Type", "application/json")

              res, err := http.DefaultClient.Do(req)
              if err != nil { panic(err) }
              defer res.Body.Close()

              body, _ := io.ReadAll(res.Body)
              if res.StatusCode >= 400 {
                  panic(fmt.Sprintf("API error %d: %s", res.StatusCode, body))
              }
              fmt.Println(string(body))
          }
  /api/v1/campaigns/{type}/{id}:
    delete:
      description: |
        Sets `isdeleted=1`, `ispaused=1`, `dayactive=0`. The campaign and
        its history remain in the database for billing/stats reconciliation
        but stop serving immediately. Idempotent — deleting an already-
        deleted campaign returns 404.
      parameters:
      - explode: false
        in: path
        name: type
        required: true
        schema:
          enum:
          - ron
          - cpm
          - flatrate
          - directdeal
          - rtb
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_campaigns__type___id__delete_200_response"
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Campaign not found or already deleted.
      summary: Soft-delete a campaign.
      tags:
      - Campaigns
      x-scope: campaigns.write
      x-status: stable
      x-codeSamples:
      - lang: shell
        label: curl
        source: |
          curl -sS -X DELETE "https://up.go-adserver.com/api/v1/campaigns/ron/123" \
            -H "Authorization: Bearer $GAS_API_KEY"
      - lang: php
        label: PHP (cURL)
        source: |
          <?php
